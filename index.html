
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Character Studio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 22px;
}
h1 { color: #a78bfa; }
p { color: #c4c4d4; }
.container {
  max-width: 650px;
  margin: auto;
}
video { display: none; }
canvas {
  width: 100%;
  background: #25253b;
  border-radius: 20px;
  margin-top: 15px;
}
select, button {
  padding: 13px;
  border-radius: 12px;
  border: none;
  margin: 7px;
  font-size: 16px;
}
select { background: #292943; color: white; }
button {
  background: #8b5cf6;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
button:disabled { opacity: .4; cursor: not-allowed; }
.record { background: #ef4444; }
#status { color: #a78bfa; }
</style>
</head>

<body>
<div class="container">
  <h1>🎭 AI CHARACTER STUDIO</h1>
  <p>Choose your character and make a video!</p>

  <h3>Choose your character</h3>
  <select id="character">
    <option value="🤖">Robot</option>
    <option value="👽">Alien</option>
    <option value="🦸">Superhero</option>
    <option value="🐼">Panda</option>
    <option value="🧛">Vampire</option>
    <option value="🦖">Dinosaur</option>
    <option value="🤡">Funny Clown</option>
    <option value="👑">King</option>
  </select>

  <br>
  <button id="start">📷 START CAMERA</button>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="screen" width="640" height="480"></canvas>

  <br>
  <button class="record" id="record" disabled>
    🔴 RECORD
  </button>
  <button id="stop" disabled>⏹ STOP</button>
  <p id="status">Waiting for camera...</p>
  <a id="download" hidden download="my-video.webm">
    <button>⬇️ DOWNLOAD VIDEO</button>
  </a>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const character = document.getElementById("character");
const status = document.getElementById("status");

let faceLandmarker;
let camera;
let recorder;
let chunks = [];
let running = false;
let recording = false;
let lastFace = null;
let animation = 0;

async function setupAI() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1
    }
  );
}

document.getElementById("start").onclick = async () => {
  try {
    status.textContent = "Loading camera and AI...";
    camera = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    });

    video.srcObject = camera;
    await video.play();

    if (!faceLandmarker) await setupAI();

    running = true;
    document.getElementById("record").disabled = false;
    status.textContent = "Camera ready! Choose a character.";
    draw();
  } catch (error) {
    status.textContent = "Camera error: " + error.message;
  }
};

function draw() {
  if (!running) return;

  ctx.save();
  ctx.clearRect(0, 0, 640, 480);
  ctx.translate(640, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, 640, 480);
  ctx.restore();

  try {
    const result = faceLandmarker.detectForVideo(
      video, performance.now()
    );

    if (result.faceLandmarks.length) {
      const face = result.faceLandmarks[0];
      const xs = face.map(p => p.x);
      const ys = face.map(p => p.y);

      lastFace = {
        x: 640 * (1 - (Math.min(...xs) + Math.max(...xs)) / 2),
        y: 480 * (Math.min(...ys) + Math.max(...ys)) / 2
      };
    }
  } catch (e) {}

  if (lastFace) {
    const t = performance.now() / 300;
    const x = Math.max(45, Math.min(595, lastFace.x + 90));
    const y = Math.max(65, Math.min(415,
      lastFace.y + Math.sin(t) * 12));

    ctx.font = "85px Arial";
    ctx.textAlign = "center";
    ctx.fillText(character.value, x, y);

    ctx.font = "18px Arial";
    ctx.fillStyle = "white";
    ctx.fillText("YOUR CHARACTER", x, y + 30);
  }

  animation = requestAnimationFrame(draw);
}

document.getElementById("record").onclick = () => {
  chunks = [];

  const stream = canvas.captureStream(30);
  camera.getAudioTracks().forEach(track =>
    stream.addTrack(track)
  );

  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => {
    if (e.data.size) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, {type: "video/webm"});
    const url = URL.createObjectURL(blob);
    const download = document.getElementById("download");
    download.href = url;
    download.hidden = false;
    status.textContent = "Video ready! Download it!";
  };

  recorder.start();
  recording = true;
  document.getElementById("record").disabled = true;
  document.getElementById("stop").disabled = false;
  status.textContent = "🔴 Recording...";
};

document.getElementById("stop").onclick = () => {
  if (recorder && recording) {
    recorder.stop();
    recording = false;
    document.getElementById("record").disabled = false;
    document.getElementById("stop").disabled = true;
  }
};
</script>
</body>
</html>
